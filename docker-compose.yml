# docker-compose.yml — orchestrates the dev environment for pension-project.
# Run with:  docker compose up -d
# Stop with: docker compose down

services:

  # ============================================================
  # PostgreSQL database
  # ============================================================
  postgres:
    image: postgres:16
    container_name: pension-postgres
    restart: unless-stopped

    # Read credentials from .env file (in same directory as this compose file)
    env_file:
      - .env

    # Postgres needs these env vars at startup to initialize the cluster
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # Expose port 5432 to your Mac so DBeaver/TablePlus can connect.
    # Format: "host_port:container_port"
    ports:
      - "5432:5432"

    # Persist database files to a named volume.
    # Even if the container is deleted, data survives in this volume.
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Healthcheck so other services can wait until postgres is actually ready
    # (it takes a few seconds after the container starts to accept connections).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================
  # Python application container
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pension-app
    restart: unless-stopped

    env_file:
      - .env
    environment:
      DBT_PROFILES_DIR: /app/dbt

    # Wait until postgres is healthy before starting app
    depends_on:
      postgres:
        condition: service_healthy

    # Mount the project directory into the container at /app.
    # Edits on your Mac are instantly visible inside the container — no rebuild needed.
    volumes:
      - .:/app

    # Expose Jupyter port (we'll use this in later weeks)
    ports:
      - "8888:8888"

    # Keep the container running idle. We'll `docker compose exec app bash`
    # to drop into it whenever we want to run scripts.
    command: tail -f /dev/null

  # ============================================================
  # Airflow (orchestration) 
  # ============================================================
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: pension-airflow
    restart: unless-stopped

    # A-1: run as root so the container can read the host Docker socket on
    # Docker Desktop for Mac (no Linux gid matching needed).
    user: root

    # NOTE: deliberately NO env_file here. Airflow holds no Snowflake/PG creds —
    # those live in pension-app. Airflow just shells in. (Least privilege.)
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"   # don't clutter the UI with demos

    depends_on:
      - app                                   # app (and its postgres) up first

    ports:
      - "8080:8080"                           # Airflow UI → http://localhost:8080

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # A-1: borrow host daemon
      - ./airflow/dags:/opt/airflow/dags            # our DAG .py files (Step B)
      - airflow_data:/opt/airflow                   # persist metadata DB + logs

    command: airflow standalone

# ============================================================
# Named volumes (managed by Docker, persist across container rebuilds)
# ============================================================
volumes:
  postgres_data:
    name: pension_postgres_data
  airflow_data:                
    name: pension_airflow_data
