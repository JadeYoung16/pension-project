name: CI

on:
  pull_request:
    branches: [main]

jobs:
  dbt-checks:
    name: dbt parse + compile + sqlfluff lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake==1.11.5

      - name: Install sqlfluff
        run: pip install sqlfluff==4.2.1 sqlfluff-templater-dbt==4.2.1

      - name: Create dummy profiles.yml for parse
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          pension_dwh:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: dummy-account
                user: dummy-user
                password: dummy-password
                role: dummy-role
                database: dummy-db
                warehouse: dummy-wh
                schema: dummy-schema
                threads: 1
          EOF

      - name: Install dbt packages
        working-directory: dbt/pension_dwh
        run: dbt deps

      - name: Run dbt parse
        working-directory: dbt/pension_dwh
        run: dbt parse
      
      - name: Create real profiles.yml for compile
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          # write the RSA private key to a file for key-pair auth
          mkdir -p ~/.secrets
          printf '%s\n' "${SNOWFLAKE_PRIVATE_KEY}" > ~/.secrets/snowflake_key.p8
          chmod 600 ~/.secrets/snowflake_key.p8
          cat > ~/.dbt/profiles.yml <<EOF
          pension_dwh:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ${SNOWFLAKE_ACCOUNT}
                user: ${SNOWFLAKE_USER}
                private_key_path: $HOME/.secrets/snowflake_key.p8
                role: ${SNOWFLAKE_ROLE}
                warehouse: ${SNOWFLAKE_WAREHOUSE}
                database: ${SNOWFLAKE_DATABASE}
                schema: DBT_DEV
                threads: 4
          EOF
          
      - name: Run dbt compile
        working-directory: dbt/pension_dwh
        run: dbt compile

      - name: Run sqlfluff lint
        working-directory: dbt/pension_dwh
        run: sqlfluff lint models/
