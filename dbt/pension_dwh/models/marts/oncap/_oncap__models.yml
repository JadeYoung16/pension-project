version: 2

models:
  - name: dim_member
    description: "SCD Type 2 member dimension. One row per member per validity window."

    columns:
      - name: member_sk
        description: "Surrogate key (from dbt_scd_id). Used for fact table joins."
        data_tests:
          - unique
          - not_null

      - name: member_id
        description: "Natural key. Multiple rows per member across SCD2 windows."
        data_tests:
          - not_null

      - name: employer_id
        data_tests:
          - not_null

      - name: status_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A', 'D', 'R', 'T', 'S']

      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Active', 'Deferred', 'Retired', 'Terminated', 'Survivor']

      - name: sex_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1', '2', '9']

      - name: sex
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Male', 'Female', 'Not stated']

      - name: marital_status_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['S', 'M', 'D', 'W', 'U']

      - name: marital_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Single', 'Married', 'Divorced', 'Widowed', 'Unknown']

      - name: salary_band_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['EN', 'MD', 'SR', 'EX']

      - name: salary_band
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Entry', 'Mid', 'Senior', 'Executive']

      - name: valid_from
        data_tests:
          - not_null

  - name: dim_employer
    description: "SCD Type 2 employer dimension. One row per employer per validity window."

    columns:
      - name: employer_sk
        description: "Surrogate key (from dbt_scd_id). Used for fact table joins."
        data_tests:
          - unique
          - not_null

      - name: employer_id
        description: "Natural key. Multiple rows per employer across SCD2 windows."
        data_tests:
          - not_null

      - name: sector_category_code
        description: "CRA T3010 category code. FK to dim_sector (Day 4)."
        data_tests:
          - not_null

      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'WITHDRAWN']

      - name: employer_size_band
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['MICRO', 'SMALL', 'MEDIUM', 'LARGE']

      - name: pay_frequency_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['WK', 'BW', 'SM', 'MO']

      - name: pay_frequency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['weekly', 'biweekly', 'semimonthly', 'monthly']

      - name: acquisition_channel
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['outbound', 'referral', 'inbound', 'event', 'partnership']

      - name: prospect_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['t3010_outbound_list', 'referral_existing_employer', 'conference', 'broker', 'inbound_web', 'chamber_of_commerce']

      - name: valid_from
        data_tests:
          - not_null

  - name: dim_charity
    description: >
      Charity dimension from CRA T3010 Open Data. Grain: one row per
      charity per fiscal period end (BN + FPE). Yearly-partition pattern
      (not SCD2). Currently single-year (2023) snapshot; PK structured
      to support multi-year extension. Orphan dimension — external data
      showcase, no fact currently joins to it.
    columns:
      - name: charity_sk
        description: Surrogate key, MD5(business_number + fiscal_period_end).
        data_tests:
          - unique
          - not_null

      - name: business_number
        description: CRA business number (natural key).
        data_tests:
          - not_null

      - name: fiscal_period_end
        description: Fiscal period end date; second half of grain.
        data_tests:
          - not_null

      - name: fiscal_year
        description: Year extracted from FPE; yearly-partition key.
        data_tests:
          - not_null

      - name: sector_category_code
        description: CRA category code (leading zeros stripped), FK to sector seed.
        data_tests:
          - relationships:
              arguments:
                to: ref('cra_sector_category')
                field: sector_category_code

      - name: legal_name
        description: Charity legal name from ident; ~8 rows NULL (identity record absent).
        data_tests:
          - not_null:
              config:
                severity: warn

  - name: fct_transaction
    description: >
      Pension contribution fact. Grain: one contribution event
      (deduplicated by transaction_id, keeping earliest source_row_num).
      Includes rejected (rj) transactions — filter via transaction_status.
      SK bound at ETL time via point-in-time join; lower bound relaxed
      pending snapshot valid_from fix (see tech debt).
    columns:
      - name: transaction_id
        description: Natural key / PK. Grain guard.
        data_tests:
          - unique
          - not_null

      - name: member_sk
        description: FK to dim_member (point-in-time). Rare NULL = orphan txn.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_member')
                field: member_sk
          - not_null:
              config:
                severity: warn

      - name: employer_sk
        description: FK to dim_employer (point-in-time).
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_employer')
                field: employer_sk
          - not_null:
              config:
                severity: warn

      - name: event_date_sk
        description: FK to dim_date (pay_period_end as YYYYMMDD).
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_sk
          - not_null

      - name: member_contribution
        description: Member contribution amount (CAD). Additive.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: employer_contribution
        description: Employer contribution amount (CAD). Additive.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
               min_value: 0

      - name: transaction_status
        description: ok / rj. Degenerate dim; rj retained for analysis.
        data_tests:
          - accepted_values:
              arguments:
                values: ['ok', 'rj']
  
  - name: fct_buyback
    description: >
      Buyback funnel accumulating snapshot. Grain: one buyback process per
      member (member_id unique; assumes one buyback per member — business
      allows multiple, future needs a buyback-instance id). Pivots bbk_*
      life events into one row with milestone date columns. quote/app dates
      aligned to logical order (least/greatest); members who applied without
      a prior quote keep quote_date NULL. SK bound at quote_date (or app_date
      fallback) via point-in-time join. Materialized as table (static data;
      production accumulating snapshot would use incremental + merge).
    columns:
      - name: member_id
        description: Grain key / PK. One buyback process per member.
        data_tests:
          - unique
          - not_null

      - name: member_sk
        description: FK to dim_member (point-in-time on quote/app date).
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_member')
                field: member_sk
          - not_null

      - name: employer_sk
        description: FK to dim_employer (point-in-time).
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_employer')
                field: employer_sk
          - not_null

      - name: outcome
        description: Funnel terminal state.
        data_tests:
          - accepted_values:
               arguments:  
                  values: ['completed', 'approved_not_completed', 'applied_not_approved', 'cancelled', 'quoted_only']

      - name: total_cost
        description: Buyback total cost (CAD).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                 min_value: 0

      - name: buyback_service_years
        description: Years of service being bought back.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
  - name: fct_email
    description: >
      Email engagement fact. Grain: one email engagement event
      (sent/delivered/opened/clicked/bounced/unsubscribed).  Member-centric: no employer FK. SK bound at ETL time
      via point-in-time join; lower bound relaxed pending snapshot
      valid_from fix (see tech debt).
    columns:
      - name: event_id
        description: Natural key / PK. Grain guard. Verified unique, no dedup needed.
        data_tests:
          - unique
          - not_null

      - name: member_sk
        description: FK to dim_member (point-in-time). NULL = orphan event.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_member')
                field: member_sk
          - not_null:
              config:
                severity: warn

      - name: event_date_sk
        description: FK to dim_date (event_timestamp as YYYYMMDD).
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_sk
          - not_null

      - name: event_type
        description: >
          sent/delivered/opened/clicked/bounced/unsubscribed.
          Degenerate dim; email funnel stages.
        data_tests:
          - accepted_values:
              arguments:
                values: ['sent', 'delivered', 'opened', 'clicked', 'bounced', 'unsubscribed']

  - name: fct_portal
    description: >
      Portal activity fact. Grain: one portal event
      (login/logout, statement_view, document_download,
      pension_calculator_use, buyback_info_page_view,
      buyback_quote_request, beneficiary_page_view). Factless —
      no additive measure, event counts via count(*) at query layer.
      Member-centric: no employer FK. SK bound at ETL time via
      point-in-time join; lower bound relaxed pending snapshot
      valid_from fix (see tech debt). VARIANT event_properties dropped
      (vestigial — empty for all event types except login's auth_method,
      which has no analytical value). referrer / ip_hash dropped
      (all-NULL / non-analytical). device_type derived from user_agent.
    columns:
      - name: event_id
        description: Natural key / PK. Grain guard. Verified unique, no dedup needed.
        data_tests:
          - unique
          - not_null

      - name: member_sk
        description: FK to dim_member (point-in-time). NULL = orphan event.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_member')
                field: member_sk
          - not_null:
              config:
                severity: warn

      - name: event_date_sk
        description: FK to dim_date (event_timestamp as YYYYMMDD).
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_sk
          - not_null

      - name: event_type
        description: >
          8 portal event types. Degenerate dim. page_path maps near-1:1
          to event_type (kept as raw DD, prefer event_type for analysis).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['portal_login', 'portal_logout', 'statement_view', 'document_download', 'pension_calculator_use', 'buyback_info_page_view', 'buyback_quote_request', 'beneficiary_page_view']

      - name: session_id
        description: >
          Portal session identifier. Degenerate dim (no dim_session).
          Supports session-level behavioral analysis. Verified always populated.
        data_tests:
          - not_null

      - name: device_type
        description: >
          Derived DD from user_agent (Mobile-iOS / Mobile-Android / Desktop).
          accepted_values acts as a contract sentinel on the case-when
          transformation