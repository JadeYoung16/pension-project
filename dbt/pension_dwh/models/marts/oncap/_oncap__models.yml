version: 2

models:
  - name: dim_member
    description: "SCD Type 2 member dimension. One row per member per validity window."

    columns:
      - name: member_sk
        description: "Surrogate key (from dbt_scd_id). Used for fact table joins."
        data_tests:
          - unique
          - not_null

      - name: member_id
        description: "Natural key. Multiple rows per member across SCD2 windows."
        data_tests:
          - not_null

      - name: employer_id
        data_tests:
          - not_null

      - name: status_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A', 'D', 'R', 'T', 'S']

      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Active', 'Deferred', 'Retired', 'Terminated', 'Survivor']

      - name: sex_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1', '2', '9']

      - name: sex
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Male', 'Female', 'Not stated']

      - name: marital_status_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['S', 'M', 'D', 'W', 'U']

      - name: marital_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Single', 'Married', 'Divorced', 'Widowed', 'Unknown']

      - name: salary_band_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['EN', 'MD', 'SR', 'EX']

      - name: salary_band
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Entry', 'Mid', 'Senior', 'Executive']

  - name: dim_employer
    description: "SCD Type 2 employer dimension. One row per employer per validity window."

    columns:
      - name: employer_sk
        description: "Surrogate key (from dbt_scd_id). Used for fact table joins."
        data_tests:
          - unique
          - not_null

      - name: employer_id
        description: "Natural key. Multiple rows per employer across SCD2 windows."
        data_tests:
          - not_null

      - name: sector_category_code
        description: "CRA T3010 category code. FK to dim_sector (Day 4)."
        data_tests:
          - not_null

      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'WITHDRAWN']

      - name: employer_size_band
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['MICRO', 'SMALL', 'MEDIUM', 'LARGE']

      - name: pay_frequency_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['WK', 'BW', 'SM', 'MO']

      - name: pay_frequency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['weekly', 'biweekly', 'semimonthly', 'monthly']

      - name: acquisition_channel
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['outbound', 'referral', 'inbound', 'event', 'partnership']

      - name: prospect_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['t3010_outbound_list', 'referral_existing_employer', 'conference', 'broker', 'inbound_web', 'chamber_of_commerce']

      - name: valid_from
        data_tests:
          - not_null      

  - name: dim_date
    description: "Static date dimension generated via dbt_utils.date_spine (no source). Canadian government fiscal year (Apr 1 – Mar 31)."

    columns:
      - name: date_sk
        description: "Smart integer PK (YYYYMMDD). Decision #2 MD5 exception — date is immutable, unique, no SCD2 versioning."
        data_tests:
          - unique
          - not_null

      - name: date_value
        description: "Natural key. One row per calendar day."
        data_tests:
          - unique
          - not_null
          
      - name: fiscal_quarter
        description: "Canadian government fiscal quarter (Q1 = Apr-Jun)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]