# =============================================================================
# Properties (descriptions + tests) for stg_oncap__* models
# =============================================================================
# All staging models in models/staging/oncap/ are documented here.
# As Week 5 adds more staging models, append entries to the `models:` list.
#
# Test philosophy (Week 4 baseline):
#   - PK columns: unique + not_null
#   - FK columns (joins to other tables): relationships test (added Week 5+)
#   - Enum text columns: accepted_values to lock down valid set
#   - Critical not-null business columns: not_null
#   - Numeric quality: dbt-utils accepted_range (deferred to Week 5+)
# =============================================================================

version: 2

models:

  - name: stg_oncap__employer_registry
    description: >
      One row per employer (plan sponsor).  Direct staging of
      raw_oncap.employer_registry with column renames and lowercase
      normalization on enum text columns (see model SQL for principle).
      Grain: employer.  Row count: 400.
    columns:

      - name: employer_id
        description: "Surrogate key, employer identifier."
        data_tests:
          - unique
          - not_null

      - name: business_number
        description: >
          CRA Business Number (9 digits + program suffix RR0001).
          Join key for raw_external.t3010_ident.
        data_tests:
          - not_null

      - name: employer_legal_name
        description: "Legal entity name. Display-bound; preserved case."
        data_tests:
          - not_null

      - name: employer_operating_name
        description: "DBA / operating name. May differ from legal_name."

      - name: sector_category_code
        description: "Numeric NAICS-ish industry code (e.g. '15', '40')."

      - name: size_band
        description: "Employer headcount band (lowercased from raw UPPERCASE)."
        data_tests:
          - accepted_values:
              values: ['micro', 'small', 'medium', 'large']

      - name: pay_frequency
        description: >
          Payroll cycle, mapped from raw 2-letter codes
          (wk/bw/sm/mo → weekly/biweekly/semimonthly/monthly).
        data_tests:
          - not_null
          - accepted_values:
              values: ['weekly', 'biweekly', 'semimonthly', 'monthly']

      - name: employer_status
        description: "Employer lifecycle status (lowercased from raw 'status')."
        data_tests:
          - accepted_values:
              values: ['active', 'withdrawn']

      - name: city
        description: "Operating city. Display-bound; preserved case."

      - name: postal_code
        description: "Canada postal code (uppercase format like 'M5V 3A8')."

      - name: employee_count
        description: "Total employee headcount."

      - name: enrolled_member_count
        description: >
          Active plan members. May be less than employee_count
          (eligibility, opt-out, etc.).

      - name: participation_start_date
        description: "Date employer joined the pension plan."
        data_tests:
          - not_null

      - name: administrator_name
        description: "Plan admin contact name (display-bound)."

      - name: administrator_email
        description: "Plan admin contact email."

      - name: acquisition_channel
        description: >
          How the lead was acquired (lowercase from generator phase 2).
          Used in Week 6 acquisition mart.
        data_tests:
          - accepted_values:
              values: ['event', 'inbound', 'outbound', 'partnership', 'referral']

      - name: prospect_source
        description: >
          Where the lead originated (lowercase from generator phase 2).
          Used in Week 6 acquisition mart.
        data_tests:
          - accepted_values:
              values:
                - broker
                - chamber_of_commerce
                - conference
                - inbound_web
                - referral_existing_employer
                - t3010_outbound_list

      - name: first_contact_date
        description: "Date of first sales contact with this prospect."

      - name: source_file
        description: "Raw COPY INTO source file (audit, from METADATA$FILENAME)."

      - name: source_row_num
        description: "Raw row number in source file (audit)."

      - name: loaded_at
        description: "Timestamp when raw row was loaded into Snowflake."

# ===========================================================================

  - name: stg_oncap__call_log
    description: >
      One row per member call to the OnCap call center.  Lowercase
      normalization on category/subcategory/resolution_code per the
      staging case principle.  Grain: call.  Row count: 4,122.
    columns:

      - name: call_id
        description: "PK. Format: CALL{YYYYMMDD}{6-digit sequence}."
        data_tests:
          - unique
          - not_null

      - name: member_id
        description: "FK to stg_oncap__member_census."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_oncap__member_census')
              field: member_id

      - name: agent_id
        description: >
          Call-center agent identifier (format AGT{4-digit}).
          80 unique agents in current dataset.  No agent dim table;
          treated as semi-structured ID for now.
        data_tests:
          - not_null

      - name: call_timestamp
        description: "Call start time (TIMESTAMP_TZ, source timezone preserved)."
        data_tests:
          - not_null

      - name: duration_seconds
        description: "Call duration in seconds."

      - name: call_reason_category
        description: "Top-level call reason (lowercased from raw UPPERCASE)."
        data_tests:
          - accepted_values:
              values: ['beneficiary', 'buyback', 'complaint', 'general', 'retirement', 'statement']

      - name: call_reason_subcategory
        description: >
          Detailed call reason within category (lowercased from raw
          UPPERCASE_SNAKE_CASE).  Closed business taxonomy of 19 values.
        data_tests:
          - accepted_values:
              values:
                - address_update
                - annual_request
                - cost_inquiry
                - date_projection
                - deadline_confirm
                - death_benefit
                - delayed_payment
                - discrepancy
                - eligibility
                - info
                - installment_options
                - option_selection
                - other
                - pension_amount
                - registration_help
                - staff_interaction
                - update
                - website_issue

      - name: resolution_code
        description: "Call resolution status (lowercased from raw UPPERCASE)."
        data_tests:
          - accepted_values:
              values: ['callback', 'escalated', 'resolved', 'unresolved']

      - name: csat_score
        description: >
          Customer Satisfaction score, 1-5 integer scale.
          NULL is legitimate (no survey response collected — call ended
          before survey, customer skipped, etc.).  
        data_tests:
        - dbt_utils.accepted_range:
            min_value: 1
            max_value: 5
            inclusive: true
            where: "csat_score is not null"
      - name: notes
        description: "Free-text agent notes from call. Display-bound, preserved."

      - name: source_file
        description: "Raw COPY INTO source file (audit)."

      - name: source_row_num
        description: "Raw row number in source file (audit)."

      - name: loaded_at
        description: "Timestamp when raw row was loaded into Snowflake."


# ===========================================================================

  - name: stg_oncap__member_census
    description: >
      One row per pension plan member (latest monthly snapshot).
      Grain: (member_id, employer_id) — composite PK.
      Row count: 50,000 (one snapshot of 100,000 raw rows).
      Raw retains both monthly snapshots (20231231, 20240131) for
      future SCD Type 2 modeling at the snapshot layer.
    data_tests:
    - dbt_utils.unique_combination_of_columns:
        combination_of_columns:
          - member_id
          - employer_id

    columns:

      - name: member_id
        description: "FK to stg_oncap__member_census."
        data_tests:
          - not_null

      - name: employer_id
        description: >
          FK to stg_oncap__employer_registry.
          Combined with member_id forms the composite PK.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_oncap__employer_registry')
              field: employer_id

      # --- PII: identity --------------------------------------------------
      - name: sin_last_4
        description: >
          Last 4 digits of Social Insurance Number. Used for ID verification
          in customer service interactions. Not displayed in BI reports.
        config:                           
          meta:
            contains_pii: true
            pii_type: government_id
            sensitivity: high

      - name: first_name
        description: "Member first name."
        config:
          meta:
            contains_pii: true
            pii_type: name
            sensitivity: high

      - name: middle_initial
        description: "Member middle initial. NULL when member has no middle name."
        config:
          meta:
            contains_pii: true
            pii_type: name
            sensitivity: high

      - name: last_name
        description: "Member last name."
        config:
          meta:
            contains_pii: true
            pii_type: name
            sensitivity: high

      - name: date_of_birth
        description: "Member date of birth (renamed from raw `dob`)."
        data_tests:
          - not_null
        config:
          meta:
            contains_pii: true
            pii_type: date_of_birth
            sensitivity: high

      # --- Demographics ---------------------------------------------------
      - name: sex
        description: >
          Mapped from raw numeric code per Statistics Canada standard:
          1→male, 2→female, 9→not_stated. Mapping verified against
          generator config and StatCan census codeset.
        data_tests:
          - not_null
          - accepted_values:
              values: ['male', 'female', 'not_stated']

      - name: marital_status_code
        description: >
          Single-character marital status code (lowercased).
          Values: m (married), s (single), d (divorced),
          w (widowed), u (unknown/unspecified).
        data_tests:
          - accepted_values:
              values: ['m', 's', 'd', 'w', 'u']

      - name: language_preference
        description: >
          Language preference code (lowercased). Values: en (English),
          fr (French). Full label translation in dim_member mart.
        data_tests:
          - accepted_values:
              values: ['en', 'fr']

      # --- PII: contact ---------------------------------------------------
      - name: street_address
        description: "Member street address."
        config:
          meta:
            contains_pii: true
            pii_type: address
            sensitivity: high

      - name: city
        description: "Member city. City-level only, lower sensitivity."
        config:
          meta:
            contains_pii: true
            pii_type: address
            sensitivity: low

      - name: province
        description: "Canadian province (2-letter code)."

      - name: postal_code
        description: >
          Canadian postal code (M5V 3A8 format). Quasi-identifier when
          combined with DOB + sex.
        config:
          meta:
            contains_pii: true
            pii_type: address
            sensitivity: medium

      - name: phone
        description: "Member phone number. NULL if not provided."
        config:
          meta:
            contains_pii: true
            pii_type: contact
            sensitivity: high

      - name: email
        description: "Member email address. NULL if not provided."
        config:
          meta:
            contains_pii: true
            pii_type: contact
            sensitivity: high

      # --- Employment -----------------------------------------------------
      - name: hire_date
        description: "Date member was hired by current employer."
        data_tests:
          - not_null

      - name: enrollment_date
        description: "Date member enrolled in the pension plan."
        data_tests:
          - not_null

      - name: termination_date
        description: >
          Date member's employment ended. NULL if currently employed.

      - name: status_code
        description: >
          Member employment status (lowercased single-char code).
          Values: a (active), d (departed/terminated), r (retired),
          s (suspended), t (transferred).
          Full label translation in dim_member mart.
        data_tests:
          - not_null
          - accepted_values:
              values: ['a', 'd', 'r', 's', 't']

      - name: employment_type
        description: >
          Employment type code (lowercased). Values: ft (full-time),
          pt (part-time). Full label translation in dim_member mart.
        data_tests:
          - not_null
          - accepted_values:
              values: ['ft', 'pt']

      # --- Compensation ---------------------------------------------------
      - name: annual_salary
        description: "Annual base salary in CAD."

      - name: salary_band_code
        description: >
          Salary band code (lowercased). Values: en (entry), md (mid),
          sr (senior), ex (executive). Full label translation in
          dim_member mart.
        data_tests:
          - accepted_values:
              values: ['en', 'md', 'sr', 'ex']

      - name: job_category
        description: >
          Job category code (lowercased). Values: adm (admin),
          svc (service), mgr (management), prf (professional),
          exe (executive). Full label translation in dim_member mart.
        data_tests:
          - accepted_values:
              values: ['adm', 'svc', 'mgr', 'prf', 'exe']

      # --- Pension service & accrual --------------------------------------
      - name: credited_service_years
        description: "Years of credited pensionable service."

      - name: eligible_buyback_service
        description: >
          Years of service eligible for buyback (e.g. unpaid leave
          periods that can be retroactively credited).

      - name: last_buyback_leave_end_date
        description: >
          End date of last buyback-eligible leave period.
          NULL if member has never had a buyback-eligible leave.

      - name: normal_retirement_date
        description: "Member's normal retirement date."

      - name: accrued_annual_pension
        description: "Annual pension amount accrued to date in CAD."

      - name: beneficiary_on_file
        description: >
          Whether member has designated a beneficiary on file.
          Values: Y (yes), N (no). Preserved as-is (only 2 values,
          no normalization needed).
        data_tests:
          - accepted_values:
              values: ['Y', 'N']

      # --- Membership lifecycle -------------------------------------------
      - name: member_since_date
        description: >
          Date member's enrollment became effective. Nullable: NULL
          indicates pending enrollment or historical migration edge case.

      - name: last_statement_date
        description: "Date of most recent annual statement sent."

      - name: record_status
        description: >
          Record-level status code (lowercased). 'a' for active records.
          Differs from status_code (which is employment status).
        data_tests:
          - accepted_values:
              values: ['a']

      # --- Audit ----------------------------------------------------------
      - name: source_file
        description: >
          Raw COPY INTO source file (audit). All rows in this staging
          come from the latest snapshot file (e.g. ONCAP001_MEMBER_CENSUS_20240131).

      - name: source_row_num
        description: "Raw row number in source file (audit)."

      - name: loaded_at
        description: "Timestamp when raw row was loaded into Snowflake."
    


# ===========================================================================

  - name: stg_oncap__seminar_attendance
    description: >
      One row per seminar registration. Grain: registration.
      Row count: 5,816.
      
      Tracks both registration and actual attendance (via attended_flag).
      seminar_location captures the physical city (Ontario) or 'Virtual'
      for online seminars; deterministic upstream relationship with
      attendance_format.
    columns:

      - name: attendance_id
        description: "PK. Format: SEM{YYYY}01{7-digit sequence}."
        data_tests:
          - unique
          - not_null

      - name: member_id
        description: "FK to stg_oncap__member_census."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_oncap__member_census')
              field: member_id

      - name: registration_date
        description: "Date member registered for the seminar."
        data_tests:
          - not_null

      - name: seminar_date
        description: "Date seminar was held."
        data_tests:
          - not_null

      - name: seminar_topic
        description: "Seminar topic (lowercased from raw UPPERCASE_SNAKE)."
        data_tests:
          - not_null
          - accepted_values:
              values: ['buyback_101', 'general', 'investment', 'pre_retirement']

      - name: attendance_format
        description: "Format (lowercased from raw UPPERCASE)."
        data_tests:
          - not_null
          - accepted_values:
              values: ['in_person', 'virtual']

      - name: seminar_location
        description: >
          Physical city (Hamilton/Kingston/London/Mississauga/Ottawa/
          Sudbury/Toronto) for in_person; 'Virtual' for virtual format.
          C-class display field, preserved case.

      - name: attended_flag
        description: >
          Whether member actually attended (Y) or registered but no-show (N).
          Preserved as-is (2 values, no normalization needed).
        data_tests:
          - accepted_values:
              values: ['Y', 'N']

      - name: source_file
        description: "Raw COPY INTO source file (audit)."

      - name: source_row_num
        description: "Raw row number in source file (audit)."

      - name: loaded_at
        description: "Timestamp when raw row was loaded into Snowflake."


# ===========================================================================

  - name: stg_oncap__email_engagement
    description: >
      One row per email event. Grain: event (not email).
      Row count: 227,502 (~50k unique emails × ~4.5 events per email funnel).
      
      Event funnel: SENT → DELIVERED → OPENED → CLICKED.
      Failure paths: BOUNCED (delivery failure), UNSUBSCRIBED (compliance).
      
      Campaign normalization: campaign_id and campaign_name are 1:1 in
      raw; would normalize to dim_campaign in mart layer.
    columns:

      - name: event_id
        description: "PK. Format: EML{YYYYMMDD}{6-digit sequence}."
        data_tests:
          - unique
          - not_null

      - name: member_id
        description: "FK to stg_oncap__member_census."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_oncap__member_census')
              field: member_id

      - name: campaign_id
        description: >
          Campaign identifier. Current values: CAMP_NEWSLETTER,
          CAMP_Q1_2024_STMT. Preserved as identifier (case kept);
          new campaigns added over time, so no accepted_values lock.
        data_tests:
          - not_null

      - name: campaign_name
        description: >
          Human-readable campaign name, 1:1 with campaign_id.
          Display-bound; preserved case. Candidate for dim_campaign
          extraction in mart layer.

      - name: event_type
        description: "Email funnel event (lowercased from raw UPPERCASE)."
        data_tests:
          - not_null
          - accepted_values:
              values: ['sent', 'delivered', 'opened', 'clicked', 'bounced', 'unsubscribed']

      - name: event_timestamp
        description: "Event timestamp (TIMESTAMP_TZ, source timezone preserved)."
        data_tests:
          - not_null

      - name: link_url_clicked
        description: >
          URL clicked by member. NULL when event_type is not 'clicked'
          (95.4% of rows). Case-sensitive, preserved as-is.

      - name: source_file
        description: "Raw COPY INTO source file (audit)."

      - name: source_row_num
        description: "Raw row number in source file (audit)."

      - name: loaded_at
        description: "Timestamp when raw row was loaded into Snowflake."


 # ===========================================================================

  - name: stg_oncap__life_event
    description: >
      One row per member life event. Grain: event.  Row count: 17,638.
      
      Wide event table: different event_type_code values populate
      different column subsets:
      - Buyback events (80%): use buyback_category_code, costs,
        payment_method, etc.
      - Non-buyback events (ADDR_CHG, BENE_UPD, MARITAL — 20%):
        buyback columns are NULL by design.
      
      Conditional NULL semantics are documented per-column.
    columns:

      - name: event_id
        description: "PK. Format: EVT{16-char alphanumeric}."
        data_tests:
          - unique
          - not_null

      - name: member_id
        description: "FK to stg_oncap__member_census."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_oncap__member_census')
              field: member_id

      - name: employer_id
        description: "FK to stg_oncap__employer_registry."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_oncap__employer_registry')
              field: employer_id

      - name: event_date
        description: "Date the event occurred."
        data_tests:
          - not_null

      - name: event_timestamp
        description: "Event timestamp (TIMESTAMP_TZ, source timezone preserved)."

      - name: event_type_code
        description: >
          Type of life event (lowercased from raw UPPERCASE).
          BBK_* are buyback-flow stages; ADDR_CHG/BENE_UPD/MARITAL
          are non-buyback events.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - addr_chg
                - bbk_app
                - bbk_approved
                - bbk_cancelled
                - bbk_complete
                - bbk_installment_pay
                - bbk_quote
                - bene_upd
                - marital

      - name: event_status
        description: "Current event status (lowercased from raw UPPERCASE)."
        data_tests:
          - not_null
          - accepted_values:
              values: ['approved', 'cancelled', 'completed', 'quoted', 'rejected', 'submitted']

      - name: channel_code
        description: >
          How the event was initiated (lowercased from raw UPPERCASE).
          ADVISOR (rep-initiated), MAIL (paper form), PHONE (call center),
          PORTAL (self-service), SYSTEM (automated).
        data_tests:
          - not_null
          - accepted_values:
              values: ['advisor', 'mail', 'phone', 'portal', 'system']

      - name: buyback_category_code
        description: >
          Buyback service category (lowercased from raw UPPERCASE).
          Values: loa (leave of absence), ml (maternity leave),
          pep (prior eligible period), pst (prior service transfer),
          ptt (part-time). NULL for non-buyback events.
        data_tests:
          - accepted_values:
              values: ['loa', 'ml', 'pep', 'pst', 'ptt']

      - name: buyback_service_years
        description: >
          Years of service being bought back (decimal).
          NULL for non-buyback events.

      - name: leave_end_date
        description: >
          End date of leave period for buyback calculations.
          NULL for non-buyback events.

      - name: months_since_eligibility
        description: >
          Months elapsed since member became eligible to buy back the
          leave period. Used for window/option determination.
          NULL for non-buyback events.

      - name: is_within_window
        description: >
          Y if buyback request is within the time window for standard
          processing. N if outside (requires extra approval).
          NULL for non-buyback events. Preserved as Y/N.
        data_tests:
          - accepted_values:
              values: ['Y', 'N']

      - name: is_open_option
        description: >
          Y if member has an open buyback option pending decision.
          NULL for non-buyback events. Preserved as Y/N.
        data_tests:
          - accepted_values:
              values: ['Y', 'N']

      - name: member_cost
        description: >
          Member's portion of buyback cost in CAD.
          NULL for non-buyback events.

      - name: employer_cost
        description: >
          Employer's portion of buyback cost in CAD.
          NULL for non-buyback events.

      - name: total_cost
        description: >
          Total buyback cost in CAD (= member_cost + employer_cost in raw).
          NULL for non-buyback events. Sum invariant deferred to
          singular test in Week 9 polish.

      - name: payment_method
        description: >
          How member pays the buyback (lowercased from raw UPPERCASE).
          NULL for non-buyback events or when not yet decided.
        data_tests:
          - accepted_values:
              values: ['installment', 'lump_sum']

      - name: installment_months
        description: >
          Number of installment months for INSTALLMENT payment_method.
          NULL for LUMP_SUM payments and non-buyback events.

      - name: notes
        description: "Free-text notes from the event recorder. Display-bound, preserved."

      - name: source_file
        description: "Raw COPY INTO source file (audit)."

      - name: source_row_num
        description: "Raw row number in source file (audit)."

      - name: loaded_at
        description: "Timestamp when raw row was loaded into Snowflake."


# ===========================================================================

  - name: stg_oncap__transaction
    description: >
      One row per pension contribution transaction. Grain: transaction.
      Row count: 186,865.
      
      Known data quality issues (see model SQL header):
      - transaction_id has 3 duplicates (generator bug, tracked as warn).
      - contribution_type is 100% 'REG' (generator gap, no BBK/VOL).
      - buyback_reference_id is 100% NULL (related to above).
    columns:

      - name: transaction_id
        description: >
          Transaction identifier. Format: TXN{13-digit}.
          NOT 100% unique due to upstream generator bug
          (3 duplicates of 186,865). Unique test configured as warn,
          with error threshold at 10 duplicates to catch degradation.
          Fix in Week 9 polish backlog.
        data_tests:
          - unique:
              config:
                severity: warn
                warn_if: ">= 1"
                error_if: ">= 10"
          - not_null

      - name: member_id
        description: "FK to stg_oncap__member_census."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_oncap__member_census')
              field: member_id

      - name: employer_id
        description: "FK to stg_oncap__employer_registry."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_oncap__employer_registry')
              field: employer_id

      - name: pay_date
        description: "Date pension contribution was paid."
        data_tests:
          - not_null

      - name: pay_period_start
        description: >
          Start date of pay period covered by this transaction.
          2% NULL (3,759/186,865) — generator artifact, random
          across all pay frequencies. Derivable in mart layer
          from pay_date - frequency_offset.
        data_tests:
          - not_null:
              config:
                severity: warn
                warn_if: ">= 1"
                error_if: ">= 5000"

      - name: pay_period_end
        description: "End date of pay period covered by this transaction."
        data_tests:
          - not_null

      - name: pay_frequency
        description: >
          Payroll cycle, mapped from raw 2-letter codes
          (wk/bw/sm/mo -> weekly/biweekly/semimonthly/monthly).
          Same mapping as stg_oncap__employer_registry; candidate
          for shared macro (Week 5+).
        data_tests:
          - not_null
          - accepted_values:
              values: ['weekly', 'biweekly', 'semimonthly', 'monthly']

      - name: pensionable_earnings
        description: "Member's pensionable earnings for this pay period, CAD."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

      - name: member_contribution
        description: "Member's contribution amount in CAD."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

      - name: employer_contribution
        description: >
          Employer's contribution amount in CAD.
          In current OnCap plan: equals member_contribution (1:1 match).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

      - name: contribution_type
        description: >
          Contribution type (lowercased). Currently only 'reg' (regular).
          Generator does not produce BBK or VOL types; relationship with
          life_event BBK_INSTALLMENT_PAY events is not modeled yet.
        data_tests:
          - not_null
          - accepted_values:
              values: ['reg']

      - name: buyback_reference_id
        description: >
          When transaction is a buyback installment payment, references
          stg_oncap__life_event.event_id. Currently 100% NULL
          (see model header for context).

      - name: transaction_status
        description: "Transaction status (lowercased from raw UPPERCASE)."
        data_tests:
          - not_null
          - accepted_values:
              values: ['ok', 'rj']

      - name: source_file
        description: "Raw COPY INTO source file (audit)."

      - name: source_row_num
        description: "Raw row number in source file (audit)."

      - name: loaded_at
        description: "Timestamp when raw row was loaded into Snowflake."


# ===========================================================================

  - name: stg_oncap__portal_event
    description: >
      One row per member portal interaction. Grain: event.
      Row count: 58,537.
      
      Raw layer incompleteness: Day 5 COPY INTO partial-loaded 1,069 rows
      (1.8%) due to malformed JSON in 5 of 91 source jsonl files. Expected
      total ~59,606 rows. Week 9 polish: TRY_PARSE_JSON re-ingestion to recover.
      
      Schema notes:
      - event_type values already lowercase (phase-2 generator design)
      - page_path is 1:1 derivable from event_type (raw artifact)
      - referrer is 100% NULL (generator gap, Week 9 polish backlog)
      - user_agent has only 4 unique values (generator simplification)
      - event_properties is conditional VARIANT — populated for portal_login
        with auth_method, empty {} for other event types
    columns:

      - name: event_id
        description: "PK. Format: evt_{17-char alphanumeric}."
        data_tests:
          - unique
          - not_null

      - name: member_id
        description: "FK to stg_oncap__member_census."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_oncap__member_census')
              field: member_id

      - name: session_id
        description: >
          Browser session identifier. Multiple events share a session_id
          when user stays logged in.
        data_tests:
          - not_null

      - name: event_timestamp
        description: "Event timestamp (TIMESTAMP_TZ, source timezone preserved)."
        data_tests:
          - not_null

      - name: event_type
        description: >
          Type of portal interaction. Already lowercased in raw (phase-2
          generator). 1:1 mapping to page_path in current generator design.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - portal_login
                - portal_logout
                - statement_view
                - pension_calculator_use
                - buyback_info_page_view
                - document_download
                - beneficiary_page_view
                - buyback_quote_request

      - name: page_path
        description: >
          URL path of the page generating the event. Currently 1:1
          with event_type (e.g. portal_login → /login). Real web events
          typically have multi-source pages; this is a generator artifact.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - /login
                - /logout
                - /statements
                - /calculator
                - /buyback/info
                - /documents
                - /beneficiary
                - /buyback/quote

      - name: referrer
        description: >
          HTTP referrer URL. Currently 100% NULL — generator does not
          populate. Week 9 polish backlog (limits flow-source analytics).

      - name: ip_hash
        description: >
          SHA-256 hash of source IP address. Pre-hashed at ingestion
          for PII protection. 5.1% NULL (~3,000 rows) for session-continuation
          events where generator omits re-logging.
        config:
          meta:
            contains_pii: true
            pii_type: technical_identifier
            sensitivity: medium

      - name: user_agent
        description: >
          Browser/device user-agent string. 3.1% NULL (session continuation).
          Currently only 4 unique values (generator simplification).
        config:
          meta:
            contains_pii: true
            pii_type: technical_identifier
            sensitivity: low

      - name: event_properties
        description: >
          Semi-structured VARIANT field. Schema varies by event_type:
          - portal_login: {"auth_method": "password"}
          - all other event_types: {} (empty object)
          Downstream marts can flatten with event_properties:auth_method::varchar
          syntax for portal_login-specific analytics.

      - name: source_file
        description: "Raw COPY INTO source file (audit)."

      - name: source_row_num
        description: "Raw row number in source file (audit)."

      - name: loaded_at
        description: "Timestamp when raw row was loaded into Snowflake."