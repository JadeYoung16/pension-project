version: 2

models:
  - name: int_buyback_events
    description: >
      One row per buyback (bbk_*) life event, tagged with
      the application it belongs to. Each bbk_app opens a
      new application; later events of the same member
      belong to it until the next bbk_app, ordered by
      event_timestamp (entry time). Cancelled applications
      are kept, not deduplicated: which application counts
      is a mart decision.
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: application_id
        description: >
          event_id of the bbk_app that opened this
          application. Stable key for one application.
        tests:
          - not_null
      - name: application_seq
        description: >
          1 = member's first application, 2 = second.
          For readability only; it can shift if an earlier
          application is back-filled. Join on
          application_id, not on seq.
        tests:
          - not_null

  - name: int_buyback_applications
    description: >
      One row per buyback application. Attributes come from
      the bbk_app row. Milestone dates are event_date
      (receipt date for paper apps); app_entered_at is the
      entry timestamp. bbk_approved is split into
      approved_date / rejected_date. outcome = furthest step
      reached; apps still in progress at data cutoff stay
      'applied' / 'quoted' / 'approved'.
    columns:
      - name: application_id
        data_tests:
          - unique
          - not_null
      - name: member_id
        data_tests:
          - not_null
      - name: app_date
        data_tests:
          - not_null
      - name: channel_code
        data_tests:
          - accepted_values:
              arguments:
                values: ['mail', 'portal']
      - name: outcome
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'rejected',
                         'cancelled', 'approved',
                         'quoted', 'applied']
    data_tests:
      # structure (error)
      - dbt_utils.expression_is_true:
          name: int_bbk_apps_approved_xor_rejected
          arguments:
            expression: >
              approved_date is null
              or rejected_date is null
      - dbt_utils.expression_is_true:
          name: int_bbk_apps_outcome_completed
          arguments:
            expression: >
              (outcome = 'completed')
              = (completed_date is not null)
      - dbt_utils.expression_is_true:
          name: int_bbk_apps_outcome_rejected
          arguments:
            expression: >
              (outcome = 'rejected')
              = (rejected_date is not null)
      - dbt_utils.expression_is_true:
          name: int_bbk_apps_outcome_cancelled
          arguments:
            expression: >
              (outcome = 'cancelled')
              = (cancelled_date is not null)
      - dbt_utils.expression_is_true:
          name: int_bbk_apps_outcome_approved
          arguments:
            expression: >
              (outcome = 'approved')
              = (approved_date is not null
                 and completed_date is null)
      - dbt_utils.expression_is_true:
          name: int_bbk_apps_outcome_quoted
          arguments:
            expression: >
              (outcome = 'quoted')
              = (quote_date is not null
                 and approved_date is null
                 and rejected_date is null)
      - dbt_utils.expression_is_true:
          name: int_bbk_apps_outcome_applied
          arguments:
            expression: >
              (outcome = 'applied')
              = (quote_date is null
                 and cancelled_date is null)
      # flow (warn)
      - dbt_utils.expression_is_true:
          name: int_bbk_apps_quote_after_app
          arguments:
            expression: >
              quote_date is null
              or quote_date >= app_date
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          name: int_bbk_apps_approved_after_quote
          arguments:
            expression: >
              approved_date is null
              or (quote_date is not null
                  and approved_date >= quote_date)
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          name: int_bbk_apps_rejected_after_quote
          arguments:
            expression: >
              rejected_date is null
              or (quote_date is not null
                  and rejected_date >= quote_date)
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          name: int_bbk_apps_completed_after_approved
          arguments:
            expression: >
              completed_date is null
              or (approved_date is not null
                  and completed_date >= approved_date)
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          name: int_bbk_apps_cancelled_before_quote
          arguments:
            expression: >
              cancelled_date is null
              or quote_date is null
          config:
            severity: warn

  - name: int_email_events
    description: >
      One row per email event (all types). PK =
      event_id; row count = staging. Adds bot
      detection for opened / clicked: gap from the
      prior delivery (same member and campaign) is
      below a threshold (vars
      bot_open_threshold_seconds,
      bot_click_threshold_seconds). Prior delivery,
      not first: campaigns send repeatedly. No
      message id, so an open of an older message
      right after a new delivery can be misflagged
      (rare). Other event types get NULL.
      Timestamps stay UTC; event_date_local is the
      Toronto date.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: >-
              ref('stg_oncap__email_engagement')
      - dbt_utils.expression_is_true:
          name: int_email_events_non_open_click_null
          arguments:
            expression: >
              event_type in ('opened', 'clicked')
              or (last_delivered_at is null
              and seconds_since_delivered is null
              and is_suspected_bot is null)
      - dbt_utils.expression_is_true:
          name: int_email_events_delivery_before_event
          arguments:
            expression: >
              last_delivered_at is null
              or last_delivered_at <= event_timestamp
      - dbt_utils.expression_is_true:
          name: int_email_events_gap_non_negative
          arguments:
            expression: >
              seconds_since_delivered is null
              or seconds_since_delivered >= 0
      - dbt_utils.expression_is_true:
          name: int_email_events_gap_null_matches
          arguments:
            expression: >
              (last_delivered_at is null)
              = (seconds_since_delivered is null)
      - dbt_utils.expression_is_true:
          name: int_email_events_open_click_has_delivery
          arguments:
            expression: >
              event_type not in ('opened', 'clicked')
              or last_delivered_at is not null
          config:
            severity: warn
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
      - name: event_date_local
        description: >
          Toronto local date of event_timestamp.
        data_tests:
          - not_null
      - name: last_delivered_at
        description: >
          Most recent delivered event at or before
          this event, same member and campaign.
          opened / clicked only.
      - name: seconds_since_delivered
        description: >
          Seconds from last_delivered_at to this
          event. opened / clicked only.
      - name: is_suspected_bot
        description: >
          TRUE = gap below the threshold for this
          event type. opened / clicked only; NULL
          for other types (not applicable).