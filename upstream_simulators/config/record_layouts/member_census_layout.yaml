    end: 268
    type: char
  - name: ANNUAL_SALARY
    start: 269
    end: 278
    type: num
    align: right
    pad: "0"
    implicit_decimals: 2
  - name: SALARY_BAND_CODE
    start: 279
    end: 280
    type: char
  - name: JOB_CATEGORY
    start: 281
    end: 283
    type: char
  - name: CREDITED_SERVICE_YEARS
    start: 284
    end: 288
    type: num
    align: right
    pad: "0"
    implicit_decimals: 2
  - name: ELIGIBLE_BUYBACK_SERVICE
